appId: com.driftsyncone.blowlink
productName: BlowLink
# Updates are handled by src/main/updater.ts (GitHub releases + SHA256SUMS.txt), not electron-updater.
publish: null
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/tray.png
    to: tray.png
  - from: build/tray@2x.png
    to: tray@2x.png
  - from: LICENSE
    to: LICENSE.txt
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt
# Hardening switches baked into the executable: no running it as plain Node, no
# NODE_OPTIONS or --inspect injection, and only load the (integrity-checked) app.asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target: [nsis, zip]
  icon: build/icon.ico
  artifactName: BlowLink-${version}-win-${arch}.${ext}
# Per-user installer: %LOCALAPPDATA%\Programs\BlowLink, uninstaller under HKCU, never asks
# for admin. Settings (and device tokens) live in %APPDATA%\BlowLink and survive uninstall.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  runAfterFinish: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: BlowLink
  deleteAppDataOnUninstall: false
  differentialPackage: false
  artifactName: BlowLink-Setup-${version}.exe
  uninstallDisplayName: BlowLink

linux:
  target: [AppImage, deb, tar.gz]
  icon: build/icon.png
  category: Utility
  syncDesktopName: true
  maintainer: DriftSyncOne <333997838+driftsyncone@users.noreply.github.com>
  synopsis: Connect Intiface/Buttplug games to Autoblow devices
  artifactName: BlowLink-${version}-linux-${arch}.${ext}
deb:
  artifactName: blowlink_${version}_${arch}.${ext}

mac:
  target: [dmg]
  category: public.app-category.utilities
  icon: build/icon.png
  # Ad-hoc signature only: notarising needs a paid Apple developer account.
  identity: '-'
  artifactName: BlowLink-${version}-mac-${arch}.${ext}
